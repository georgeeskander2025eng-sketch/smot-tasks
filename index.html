<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smot Tasks</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-firestore-compat.min.js"></script>
<style>
:root{color-scheme:dark;--ink:#f4eeff;--mut:#b5a6d6;--glass:rgba(255,255,255,.07);--line:rgba(255,255,255,.13);--vio:#a78bfa;--ok:#34d399;--bad:#f87171;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,sans-serif;
background:radial-gradient(1200px 700px at 15% -10%,#5b21b6 0%,transparent 60%),radial-gradient(900px 600px at 100% 110%,#7c1d8f 0%,transparent 55%),#14072b;background-attachment:fixed}
h1{font-size:clamp(1.9rem,5vw,2.8rem);font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:0}
h2{font-size:1.15rem;font-weight:700;margin:0 0 .25rem}
h3{font-weight:700;margin:0}
p{margin:0}
.mut{color:var(--mut)}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:20px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);text-align:left;color:inherit;font:inherit;display:block;width:100%}
.tap{cursor:pointer;transition:transform .15s,border-color .15s}
.tap:hover{border-color:var(--vio);transform:translateY(-2px)}
.dim{opacity:.55}
.grid2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.stack>*+*{margin-top:14px}
input,textarea{width:100%;background:rgba(10,3,25,.5);border:1px solid var(--line);border-radius:12px;padding:11px 13px;color:var(--ink);font:inherit;outline:none}
input:focus,textarea:focus,button:focus-visible{border-color:var(--vio);box-shadow:0 0 0 3px rgba(167,139,250,.3)}
label{display:block;font-size:.85rem;font-weight:600;color:var(--mut);margin-bottom:6px}
.btn{border:0;border-radius:12px;padding:11px 18px;font:inherit;font-weight:700;cursor:pointer;color:#fff;background:linear-gradient(135deg,#8b5cf6,#c026d3)}
.btn.ghost{background:var(--glass);border:1px solid var(--line);color:var(--ink)}
.btn.sm{padding:7px 12px;font-size:.85rem}
.btn.del{background:rgba(248,113,113,.15);border:1px solid rgba(248,113,113,.4);color:#fecaca}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.tabs{display:flex;gap:6px;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:5px;overflow-x:auto}
.tabs button{flex:1;white-space:nowrap;border:0;background:none;color:var(--mut);padding:9px 14px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.tabs button.on{background:rgba(167,139,250,.25);color:#fff}
.irow{display:grid;grid-template-columns:1fr 96px 40px;gap:8px;margin-bottom:8px}
.chip{display:inline-block;background:rgba(167,139,250,.16);border-radius:999px;padding:3px 10px;font-size:.8rem;margin:3px 4px 0 0}
.tag{font-size:.75rem;font-weight:700;border-radius:999px;padding:3px 10px}
.tag.b{background:rgba(96,165,250,.2);color:#bfdbfe}.tag.a{background:rgba(251,191,36,.2);color:#fde68a}
.tag.g{background:rgba(52,211,153,.18);color:#a7f3d0}.tag.x{background:rgba(248,113,113,.2);color:#fecaca}.tag.n{background:rgba(255,255,255,.1);color:var(--mut)}
.acc{padding:0}.acchead{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:none;border:0;color:inherit;font:inherit;text-align:left;padding:18px 20px;cursor:pointer;border-radius:20px}
.chev{font-size:1.3rem;transition:transform .2s;flex:none}.acc.open .chev{transform:rotate(180deg)}
.accbody{display:none;padding:0 20px 20px}.acc.open .accbody{display:block}
.rblock{border:1px solid var(--line);border-radius:14px;padding:14px;background:rgba(10,3,25,.35)}.rblock+.rblock{margin-top:12px}
.ok{color:var(--ok);font-size:1.4rem;font-weight:800}.bad{color:var(--bad);font-size:1.4rem;font-weight:800}
.line{display:grid;grid-template-columns:1fr 110px 34px;gap:10px;align-items:center}
.line .why{grid-column:1/-1}
.line+.line{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.q{font-size:.85rem;color:#fecaca;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#2a1255;border:1px solid var(--vio);padding:10px 18px;border-radius:12px;font-weight:600;z-index:20}
.tb{width:100%;border-collapse:collapse;font-size:.92rem}.tb th{text-align:left;color:var(--mut);font-weight:600;padding:8px}.tb td{padding:10px 8px;border-top:1px solid var(--line);vertical-align:middle}
.tb input[type=time]{width:112px;padding:8px}input[type=checkbox]{width:22px;height:22px;padding:0;accent-color:#8b5cf6}
button.chip{border:0;color:inherit;font:inherit;font-size:.8rem;cursor:pointer}.chip.on{background:rgba(192,38,211,.3)}
.pdf{background:#fff;color:#111;border-radius:14px;padding:28px}.pdf .tb th,.pdf .tb td{color:#111;border-color:#ddd}.pdf .ok{color:#047857}.pdf .bad{color:#b91c1c}
@media print{body{background:#fff!important}.noprint{display:none!important}.wrap{padding:0;max-width:none}.pdf{border-radius:0;padding:0}}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;color:inherit;font:inherit;font-weight:800;font-size:1.15rem;letter-spacing:-.02em;cursor:pointer;padding:0}
.lg{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#8b5cf6,#c026d3);color:#fff;font-weight:800}.lg.big{width:46px;height:46px;font-size:1.5rem;border-radius:14px}
.lgimg{height:38px;width:auto;display:block;mix-blend-mode:lighten}.lgimg.big{height:68px}
.hello{background:rgba(167,139,250,.2);border:1px solid rgba(167,139,250,.45);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.9rem}
a.btn{text-decoration:none;display:inline-block}
.tc{display:flex;align-items:center;gap:3px;white-space:nowrap}.tc .tt{width:78px;padding:8px;text-align:center;font-variant-numeric:tabular-nums}.tc .ap{border:1px solid rgba(167,139,250,.5);background:rgba(167,139,250,.22);color:#fff;border-radius:8px;padding:8px 10px;font:inherit;font-weight:700;font-size:.85rem;min-width:48px;cursor:pointer}.tc select{background:rgba(10,3,25,.6);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 3px;font:inherit;font-size:.88rem}.tc option{background:#231045;color:#fff}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script>
// Initial admin accounts. Passwords are stored as salted SHA-256 hashes, never as plain text.
const DEFAULT_ADMINS=[{u:'admin1',salt:'k7Qe2xLm',h:'adfc1647f36a60926f37d0c564187b1eeba8b0603d129df5c5b777a4f625f3c8'},{u:'manager',salt:'p9Zt4vBc',h:'fbb05d8d3746e16e3f9de714edf503edf598d00ce73562462b440c40be674d5d'}];
/* ===== Firebase Firestore data layer =====
   1) Create a Firebase project, add a Web app, enable Firestore Database.
   2) Paste your web app config below.
   3) Firestore > Rules (this app has no Firebase Auth, so rules must allow access):
      rules_version = '2';
      service cloud.firestore { match /databases/{db}/documents { match /{doc=**} { allow read, write: if true; } } }
   All data lives in six Firestore collections and syncs live between every open browser. */
const FIREBASE_CONFIG={
  apiKey:"AIzaSyAB6aJnjtspUMDzNqM4B8dJo4hf87jRNM0",
  authDomain:"smot-dolab-w-elshanta.firebaseapp.com",
  databaseURL:"https://smot-dolab-w-elshanta-default-rtdb.firebaseio.com",
  projectId:"smot-dolab-w-elshanta",
  storageBucket:"smot-dolab-w-elshanta.firebasestorage.app",
  messagingSenderId:"860725846578",
  appId:"1:860725846578:web:96c0b8958ad0f28ce3922b",
  measurementId:"G-Y7XJJWJ2K3"
};
const COLS=['events','reports','teams','aev','areps','admins','presets'];
const CN={events:'dolabEvents',reports:'dolabReports',teams:'teams',aev:'attendanceEvents',areps:'attendanceReports',admins:'admins',presets:'bagPresets'};
let DB={events:[],reports:[],teams:[],aev:[],areps:[],admins:[],presets:[]};
let fb=null,ready=false,fatal='',stale=false,loaded=0;const REMOTE={},first={};
const keyOf=(c,x)=>c==='admins'?x.u.toLowerCase().replace(/[\/\s]+/g,'_'):x.id;
const sj=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.fromEntries(Object.entries(v).sort(([a],[b])=>a<b?-1:a>b?1:0)):v);
// save() diffs the in-memory data against what Firestore last reported and writes only the changes (adds, edits, deletes)
function save(){if(!fb)return;const batch=fb.batch();let n=0;
COLS.forEach(c=>{const rm=REMOTE[c]||(REMOTE[c]=new Map()),seen=new Set();
DB[c].forEach(x=>{const k=keyOf(c,x);if(!x.ts)x.ts=Date.now();const j=sj(x);seen.add(k);if(rm.get(k)!==j){batch.set(fb.collection(CN[c]).doc(k),JSON.parse(j));rm.set(k,j);n++}});
[...rm.keys()].forEach(k=>{if(!seen.has(k)){batch.delete(fb.collection(CN[c]).doc(k));rm.delete(k);n++}})});
if(n)batch.commit().catch(e=>toast('Could not sync: '+e.message))}
function listen(c){fb.collection(CN[c]).onSnapshot(s=>{const m=new Map(),arr=[];s.forEach(d=>{const x=d.data();arr.push(x);m.set(d.id,sj(x))});arr.sort((a,b)=>(a.ts||0)-(b.ts||0));DB[c]=arr;REMOTE[c]=m;
if(!first[c]){first[c]=1;if(++loaded===COLS.length)onReady()}else live()},e=>{fatal=e.message||String(e);if(ready)toast('Sync error: '+fatal);else render()})}
function onReady(){ready=true;if(!DB.admins.length){DB.admins=DEFAULT_ADMINS.map(a=>({...a}));save()}render()}
// Re-draw when another user changes data, unless this user is mid-edit (so typing is never wiped)
function live(){if(!ready)return;const a=document.activeElement,typing=a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)&&$('#app').contains(a),
dirty=[...document.querySelectorAll('#app input:not([type=hidden]):not([type=checkbox])')].some(i=>i.value);
if(S.view==='amark'){syncMark();return}if(S.view==='report'||typing||dirty){stale=true;return}stale=false;render(true)}
document.addEventListener('focusout',()=>setTimeout(()=>{if(stale)live()},400));
function initFb(){const c=FIREBASE_CONFIG;if(!window.firebase){fatal='The Firebase SDK could not be loaded. Check your internet connection.';return}
if(/YOUR_/.test(c.projectId)||/YOUR_/.test(c.apiKey)){fatal='setup';return}
try{firebase.initializeApp(c);fb=firebase.firestore();fb.settings({ignoreUndefinedProperties:true});COLS.forEach(listen)}catch(e){fatal=e.message}}
const bootView=()=>fatal==='setup'?`<div class='card stack' style='margin-top:40px'><h1 style='font-size:1.8rem'>Connect Firebase</h1><p class='mut'>Paste your Firebase web app credentials into the <b>FIREBASE_CONFIG</b> object near the top of the script, then reload this page.</p><ol class='mut' style='padding-left:20px;line-height:1.8'><li>Create a project at console.firebase.google.com</li><li>Build, then Firestore Database, then Create database</li><li>Project settings, then Add web app, then copy the config</li><li>Open the Firestore Rules tab and publish the rules shown in the code comment</li></ol></div>`:fatal?`<div class='card stack' style='margin-top:40px'><h1 style='font-size:1.8rem'>Cannot connect</h1><p class='bad' style='font-size:1rem'>${esc(fatal)}</p><p class='mut'>Check your Firebase config and Firestore rules, then reload.</p></div>`:`<div class='card' style='margin-top:40px'><p class='mut'>Connecting to the cloud…</p></div>`;

async function sha(salt,p){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function login(u,p){try{const a=DB.admins.find(x=>x.u.toLowerCase()===u.trim().toLowerCase());
if(a&&await sha(a.salt,p)===a.h){S.admin=a.u;S.view=S.task==='att'?'aadmin':'admin';render()}else{$('#lerr').hidden=false;$('#pw').value=''}}catch(e){toast('Login needs a secure (https) page')}}
async function addAdmin(u,p){if(!u||p.length<6)return toast('Enter a username and a password of 6+ characters');if(DB.admins.some(a=>a.u.toLowerCase()===u.toLowerCase()))return toast('That username already exists');
const salt=uid()+uid();DB.admins.push({u,salt,h:await sha(salt,p)});save();render(true);toast('Admin added')}

<h2 style='margin:28px 0 12px'>Admin accounts</h2><div class='stack'>${DB.admins.map(a=>`<div class='card'><div class='row sp'><div class='row'><h2 style='margin:0'>${esc(a.u)}</h2>${a.u===S.admin?'<span class="tag g">You</span>':''}</div>${a.u===S.admin||DB.admins.length<2?'':`<button class='btn del sm' data-act='delAdmin' data-id='${esc(a.u)}'>Delete</button>`}</div>
<div class='row' style='margin-top:12px;flex-wrap:nowrap'><input type='password' placeholder='New password (6+ characters)' autocomplete='new-password' aria-label='New password for ${esc(a.u)}'><button class='btn ghost sm' data-act='setPw' data-id='${esc(a.u)}' style='white-space:nowrap'>Set password</button></div></div>`).join('')}</div>`}

V.role=()=>`${back('landing')}<div style="margin:28px 0"><h1>Who are you?</h1><p class="mut" style="margin-top:10px">Members file reports. Admins create events and review reports.</p></div>
<div class="grid2"><button class="card tap" data-act="go" data-t="${S.task==='att'?'amember':'member'}"><h2>Member</h2><p class="mut">${S.task==='att'?'Create events and mark attendance.':'See events and submit reports.'}</p></button>
<button class="card tap" data-act="go" data-t="${S.admin?(S.task==='att'?'aadmin':'admin'):'login'}"><h2>Admin</h2><p class="mut">${S.task==='att'?'Manage teams and attendance reports.':'Manage events and reports.'}</p></button></div>`;

V.login=()=>`${back('role')}<form id="lf" class="card stack" style="max-width:420px;margin:28px auto 0"><h1 style="font-size:1.8rem">Admin login</h1>
<div><label for="un">Username</label><input id="un" autocomplete="username" required></div>
<div><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required></div>
<p id="lerr" class="q" role="alert" hidden>Invalid username or password</p><button class="btn" type="submit">Log in</button></form>`;

const itemRow=(n='',q='')=>`<div class="irow"><input name="in" placeholder="Item name" value="${esc(n)}"><input name="iq" type="number" min="0" placeholder="Qty" value="${esc(q)}"><button type="button" class="btn del sm" data-act="rmItem" aria-label="Remove item">✕</button></div>`;

function createTab(){const e=evById(S.editEv)||{name:'',date:'',items:[]};
const items=e.items.length?e.items:[{name:'',qty:''}];
return `<form id="ef" class="card stack"><h2>${S.editEv?'Edit event':'Create new event'}</h2>
<div><label for="en">Event name</label><input id="en" value="${esc(e.name)}" required></div>
<div><label for="ed">Event date</label><input id="ed" type="date" value="${esc(e.date)}" required></div>
${S.editEv?'':`<div><label>Bag preset</label><div class="tabs" id="bagsel">${[['full','Full Bag'],['half','Half Bag'],['custom','Customize']].map(([k,l])=>`<button type="button" data-act="pickPreset" data-t="${k}" class="${k==='custom'?'on':''}">${l}</button>`).join('')}</div></div>`}
<div><label>Items list</label><div class="items">${items.map(i=>itemRow(i.name,i.qty)).join('')}</div>
<button type="button" class="btn ghost sm" data-act="addItem">+ Add item</button></div>
<div class="row"><button class="btn" type="submit">${S.editEv?'Save changes':'Create event'}</button>${S.editEv?'<button type="button" class="btn ghost" data-act="cancelEdit">Cancel</button>':''}</div></form>`}

function presetsTab(){return `<p class="mut" style="margin-bottom:14px">Master item lists used to pre-fill new events. Changing a preset does not alter events that already exist.</p><div class="stack">${[['full','Full Bag'],['half','Half Bag']].map(([k,l])=>{const p=DB.presets.find(x=>x.id===k),items=p&&p.items.length?p.items:[{name:'',qty:''}];return `<form class="card stack pform" data-k="${k}"><h2>${l} preset</h2><div class="items">${items.map(i=>itemRow(i.name,i.qty)).join('')}</div><div class="row"><button type="button" class="btn ghost sm" data-act="addItem">+ Add item</button><button class="btn" type="submit">Save ${l} preset</button></div></form>`}).join('')}</div>`}
function eventsTab(){if(!DB.events.length)return `<div class="card"><h2>No events yet</h2><p class="mut">Create your first event to let members file reports.</p></div>`;
return `<div class="stack">${[...DB.events].sort((a,b)=>a.date<b.date?1:-1).map(e=>`<div class="card"><div class="row sp"><div><h2>${esc(e.name)}</h2><p class="mut" style="font-size:.9rem">${fmt(e.date)} · ${DB.reports.filter(r=>r.eventId===e.id).length} report(s)</p></div>
<div class="row"><button class="btn ghost sm" data-act="editEv" data-id="${e.id}">Edit</button><button class="btn del sm" data-act="delEv" data-id="${e.id}">Delete</button></div></div>
<div style="margin-top:8px">${e.items.map(i=>`<span class="chip">${esc(i.name)} × ${esc(i.qty)}</span>`).join('')}</div></div>`).join('')}</div>`}

const mis=r=>r.lines.filter(l=>+l.qty!==+l.exp).length;
const repBlock=(e,t)=>{const r=DB.reports.find(x=>x.eventId===e.id&&x.type===t);const tag=`<span class="tag ${t==='before'?'b':'a'}">${t==='before'?'Before event':'After event'}</span>`;
if(!r)return `<div class="rblock">${tag}<p class="mut" style="margin-top:8px;font-size:.9rem">Not submitted yet.</p></div>`;const bad=mis(r);
return `<div class="rblock"><div class="row sp"><div>${tag}<p class="mut" style="font-size:.9rem;margin-top:8px">Leader: ${esc(r.leader)} · Support: ${esc(r.support)}</p><p style="margin-top:6px"><span class="tag ${bad?'x':'g'}">${bad?bad+' mismatch(es)':'All items match'}</span></p></div>
<div class="row"><button class="btn ghost sm" data-act="editRep" data-id="${r.id}" data-t="admin">Edit</button><button class="btn del sm" data-act="delRep" data-id="${r.id}">Delete</button></div></div>
<div style="margin-top:10px">${r.lines.map(l=>{const ok=+l.qty===+l.exp;return `<div class="row sp" style="padding:8px 0;border-top:1px solid var(--line)"><span>${esc(l.name)}</span><span class="mut" style="font-size:.9rem">Expected ${esc(l.exp)} · Counted ${esc(l.qty)} <span class="${ok?'ok':'bad'}" style="font-size:1rem">${ok?'✓':'✕'}</span></span></div>${ok?'':`<p class="q" style="margin:0 0 6px">Reason: ${esc(l.reason||'—')}</p>`}`}).join('')}</div></div>`};
function reportsTab(){if(!DB.events.length)return `<div class="card"><h2>No events yet</h2><p class="mut">Create an event and member reports will be grouped under it here.</p></div>`;
return `<div class="stack">${[...DB.events].sort((a,b)=>a.date<b.date?1:-1).map(e=>{const rs=DB.reports.filter(r=>r.eventId===e.id),bad=rs.reduce((n,r)=>n+mis(r),0),open=!!S.open[e.id];
const status=!rs.length?'<span class="tag n">No reports yet</span>':bad?`<span class="tag x">${bad} mismatch(es)</span>`:'<span class="tag g">All items match</span>';
const sub=['before','after'].map(t=>`${t==='before'?'Before':'After'}: ${rs.some(r=>r.type===t)?'submitted':'pending'}`).join(' · ');
return `<div class="card acc ${open?'open':''}"><button class="acchead" data-act="toggle" data-id="${e.id}" aria-expanded="${open}"><span><span class="row" style="gap:10px"><h2 style="margin:0">${esc(e.name)}</h2>${status}</span><span class="mut" style="display:block;font-size:.85rem;margin-top:4px">${fmt(e.date)} · ${sub}</span></span><span class="chev" aria-hidden="true">▾</span></button>
<div class="accbody">${repBlock(e,'before')}${repBlock(e,'after')}</div></div>`}).join('')}</div>`}

V.admin=()=>`${brand()}<div class="row sp" style="margin-bottom:16px"><h1 style="font-size:1.8rem">Admin dashboard</h1><div class="row">${back('role','Roles')}<button class="btn ghost sm" data-act="logout">Log out</button></div></div>
<div class="tabs" style="margin-bottom:16px">${[['create',S.editEv?'Edit event':'Create event'],['events','Events ('+DB.events.length+')'],['presets','Bag presets'],['reports','Reports ('+DB.reports.length+')'],['admins','Admins']].map(([k,l])=>`<button data-act="tab" data-t="${k}" class="${S.tab===k?'on':''}">${l}</button>`).join('')}</div>
${S.tab==='create'?createTab():S.tab==='events'?eventsTab():S.tab==='presets'?presetsTab():S.tab==='admins'?adminsTab():reportsTab()}`;

V.member=()=>`${brand()}${back('role','Roles')}<div style="margin:22px 0"><h1>Events</h1><p class="mut" style="margin-top:8px">Choose an event, then file a before or after report.</p></div>
${DB.events.length?`<div class="stack">${[...DB.events].sort((a,b)=>a.date<b.date?1:-1).map(e=>{const has=t=>DB.reports.find(r=>r.eventId===e.id&&r.type===t);
return `<div class="card"><h2>${esc(e.name)}</h2><p class="mut" style="font-size:.9rem">${fmt(e.date)} · ${e.items.length} item(s)</p>
<div class="row" style="margin-top:14px">${['before','after'].map(t=>{const r=has(t);return `<button class="btn ${r?'ghost':''} sm" data-act="${r?'editRep':'newRep'}" data-id="${r?r.id:e.id}" data-t="${r?'member':t}">${r?'Edit':'Fill'} ${t==='before'?'Before event':'After event'}${r?' ✓':''}</button>`}).join('')}</div></div>`}).join('')}</div>`:`<div class="card"><h2>No events yet</h2><p class="mut">An admin needs to create an event first.</p></div>`}`;

V.report=()=>{const R=S.rep,e=evById(R.eventId);const old=R.id?DB.reports.find(r=>r.id===R.id):null;
const lv=n=>old?old.lines.find(l=>l.name===n):null;
return `${back(R.from)}<form id="rf" class="card stack" style="margin-top:20px"><div><span class="tag ${R.type==='before'?'b':'a'}">${R.type==='before'?'Before event':'After event'}</span><h1 style="font-size:1.8rem;margin-top:10px">${esc(e.name)}</h1><p class="mut">${fmt(e.date)}</p></div>
<div class="grid2"><div><label for="ln">Leader name</label><input id="ln" value="${esc(old?old.leader:'')}" required></div><div><label for="sn">Support name</label><input id="sn" value="${esc(old?old.support:'')}" required></div></div>
<div><label>Count each item</label>${e.items.map((it,i)=>{const l=lv(it.name);return `<div class="line" data-i="${i}"><span style="font-weight:600">${esc(it.name)}</span><input name="q" type="number" min="0" placeholder="Qty" value="${l?esc(l.qty):''}" aria-label="Counted quantity for ${esc(it.name)}"><span class="st"></span>
<div class="why" hidden><p class="q">Reason for difference?</p><input name="r" placeholder="Reason" value="${l?esc(l.reason||''):''}"></div></div>`}).join('')}</div>
<p id="rerr" class="q" hidden></p><button class="btn" type="submit">${old?'Save changes':'Submit report'}</button></form>`};

const ldr=o=>`Event’s leader: ${esc(o.leader)}${o.tleader?` · Task’s leader: ${esc(o.tleader)}`:''}${o.jar!==undefined&&o.jar!==''?` · Jar money: ${esc(o.jar)}`:''}`;
const pool=()=>[...new Set(DB.teams.flatMap(t=>t.members))];
const pres=r=>r.rows.filter(x=>x.present).sort((a,b)=>a.name.localeCompare(b.name)||a.team.localeCompare(b.team));
const stat=r=>{const p=r.rows.filter(x=>x.present).length;return[p,r.rows.length-p]};
const tbl=r=>`<div style='overflow-x:auto;margin-top:12px'><table class='tb'><thead><tr><th>Member</th><th>Team</th><th>Arrival</th><th>Leave</th></tr></thead><tbody>${pres(r).map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.team)}</td><td>${fmtT(x.in)}</td><td>${fmtT(x.out)}</td></tr>`).join('')||"<tr><td colspan='4' class='mut'>No members marked present</td></tr>"}</tbody></table></div>`;
V.amember=()=>`${brand()}<div style='margin:6px 0 22px'><h1>Attendance</h1></div>
<form id='af' class='card stack'><h2>Create new event</h2><div><label for='an'>Event name</label><input id='an' placeholder='Enter event name' required></div>
<div><label for='al'>Event’s leader</label><input id='al' placeholder='Enter event’s leader' required></div>
<div><label for='tl'>Task’s leader</label><input id='tl' placeholder='Enter task’s leader' required></div>
<div><label for='aj'>Jar money</label><input id='aj' type='number' min='0' step='any' inputmode='decimal' placeholder='Enter jar money amount' required></div>
<div><label for='ad'>Event date</label><input id='ad' type='date' required></div><button class='btn' type='submit'>Create event</button></form>
<h2 style='margin:28px 0 12px'>Events</h2>${DB.aev.length?`<div class='stack'>${[...DB.aev].reverse().map(e=>{const r=DB.areps.find(x=>x.evId===e.id);return `<div class='card'><div class='row sp'><div><h2>${esc(e.name)}</h2><p class='mut' style='font-size:.9rem'>${ldr(e)} · ${fmt(e.date)} ${r&&r.final!==false?'<span class="tag g">Submitted</span>':r?'<span class="tag n">In progress</span>':''}</p></div><div class='row'><button class='btn sm' data-act='mark' data-id='${e.id}' data-t='amember'>${r?(r.final===false?'Continue attendance':'Edit attendance'):'Mark Attendance'}</button><button class='btn del sm' data-act='delAev' data-id='${e.id}'>Delete</button></div></div></div>`}).join('')}</div>`:`<div class='card'><p class='mut'>No events yet. Create one above.</p></div>`}`;
V.amark=()=>{const a=S.att;return `${back(a.from,'Back')}<div style='margin:18px 0'><h1 style='font-size:1.8rem'>${esc(a.name)}</h1><p class='mut'>${ldr(a)} · ${fmt(a.date)}</p></div>
<div class='grid2' style='margin-bottom:14px'>${[['Total members','tot',''],['Present','pre','ok'],['Absent','abs','bad']].map(([l,i,c])=>`<div class='card'><p class='mut' style='font-size:.85rem'>${l}</p><p id='${i}' class='${c}' style='font-size:2rem;font-weight:800'>0</p></div>`).join('')}</div>
<input id='srch' placeholder='Search by name or team' aria-label='Search members' style='margin-bottom:14px'>
<div class='card' style='padding:8px 12px;overflow-x:auto'>${a.rows.length?`<table class='tb'><thead><tr><th>Present</th><th>Member</th><th>Arrival</th><th>Leave</th><th></th></tr></thead><tbody>${a.rows.map((r,i)=>({r,i})).sort((x,y)=>(+y.r.present)-(+x.r.present)||x.r.name.localeCompare(y.r.name)||x.r.team.localeCompare(y.r.team)).map(({r,i})=>`<tr data-i='${i}' data-k='${esc(r.name+'|'+r.team)}' data-n='${esc(r.name.toLowerCase())}' data-s='${esc((r.name+' '+r.team).toLowerCase())}'><td><input type='checkbox' name='p' ${r.present?'checked':''} aria-label='Present'></td><td><b>${esc(r.name)}</b><br><span class='mut' style='font-size:.8rem'>${esc(r.team)}</span></td>${['in','out'].map(k=>`<td><div class='row' style='flex-wrap:nowrap;gap:6px'>${tsel(k,r[k])}<button type='button' class='btn ghost sm' data-act='now' data-t='${k}' title='Log current time'>Now</button></div></td>`).join('')}<td><button type='button' class='btn ghost sm' data-act='saveRow'>Save</button></td></tr>`).join('')}</tbody></table>`:`<p class='mut' style='padding:12px'>No members yet. An admin needs to create teams first.</p>`}</div>
<button class='btn' data-act='submitAtt' style='margin-top:16px'>${a.repId?'Save changes':'Submit report'}</button>`};
const pad=n=>String(n).padStart(2,'0');
const fmtT=v=>{if(!v)return'—';const[h,m]=v.split(':').map(Number);return pad(h%12||12)+':'+pad(m)+' '+(h>=12?'PM':'AM')};
const tsel=(k,v)=>{const t=v?v.split(':').map(Number):null,T=t?pad(t[0]%12||12)+':'+pad(t[1]):'',P=t?(t[0]>=12?'PM':'AM'):(new Date().getHours()>=12?'PM':'AM'),lb=k==='in'?'Arrival':'Leave';
return `<div class='tc' data-k='${k}'><input type='hidden' name='${k}' value='${esc(v||'')}'><input class='tt' type='text' inputmode='decimal' autocomplete='off' placeholder='HH:MM' maxlength='8' value='${T}' aria-label='${lb} time'><button type='button' class='ap' data-act='ap' data-p='${P}' aria-label='${lb} AM or PM, tap to switch'>${P}</button></div>`};
// Typed times: 4:41, 04:41, 0441, 441, 6, 6.00, 4:41pm, 6 PM, or 24-hour such as 18:00
function parseT(s){s=s.trim().toLowerCase();let per=null;const sf=s.match(/\s*([ap])\.?\s*m?\.?$/);if(sf){per=sf[1]==='p'?'PM':'AM';s=s.slice(0,sf.index)}
s=s.trim().replace(/[.,\s]+/g,':');const m=s.match(/^(\d{1,2}):?(\d{2})$/)||s.match(/^(\d{1,2})$/);if(!m)return null;const h=+m[1],mi=m[2]===undefined?0:+m[2];return h>23||mi>59?null:[h,mi,per]}
function setT(c,v){const[h,m]=v.split(':').map(Number),b=c.querySelector('.ap');c.querySelector('input[type=hidden]').value=v;c.querySelector('.tt').value=pad(h%12||12)+':'+pad(m);b.dataset.p=h>=12?'PM':'AM';b.textContent=b.dataset.p}
function tcUpd(c,loud){const t=c.querySelector('.tt'),b=c.querySelector('.ap'),i=c.querySelector('input[type=hidden]');
if(!t.value.trim()){i.value='';return}
const p=parseT(t.value);if(!p){i.value='';if(loud)toast('Type the time like 04:41');return}
let[h,m,per]=p;if(per)b.dataset.p=per;if(h>12){b.dataset.p='PM';h-=12}else if(h===0){b.dataset.p='AM';h=12}
b.textContent=b.dataset.p;t.value=pad(h)+':'+pad(m);i.value=pad((h%12)+(b.dataset.p==='PM'?12:0))+':'+pad(m)}
const dirtyRow=tr=>{tr.dataset.d='1';const sb=tr.querySelector('[data-act=saveRow]');if(sb)sb.textContent='Save'};
const findRep=a=>DB.areps.find(r=>r.id===a.repId)||DB.areps.find(r=>r.evId===a.evId);
const rk=x=>x.name+'|'+x.team;
// saved arrival/leave data always wins over blank defaults, so reopening the event never wipes it
function mergeRows(r){const base=DB.teams.flatMap(tm=>tm.members.map(m=>({name:m,team:tm.name,present:false,in:'',out:''}))),saved=r?r.rows:[];
return[...base.map(x=>saved.find(y=>rk(y)===rk(x))||x),...saved.filter(y=>!base.some(x=>rk(x)===rk(y)))].map(x=>({...x}))}
// create or update the one report doc for this event, applying only the change given, then write to Firestore
function upsertReport(mut,final){const a=S.att;let rep=findRep(a);
if(!rep){rep={id:uid(),evId:a.evId,evName:a.name,leader:a.leader,tleader:a.tleader||'',jar:a.jar||'',date:a.date,rows:a.rows.map(x=>({...x})),at:Date.now(),final:false};DB.areps.push(rep)}
mut(rep);rep.at=Date.now();if(final)rep.final=true;a.repId=rep.id;save();return rep}
// pull other people's saved rows into the open table without touching rows this user is editing
function syncMark(){if(!S.att)return;const rep=findRep(S.att);if(!rep)return;
document.querySelectorAll('.tb tbody tr').forEach(tr=>{if(tr.dataset.d==='1')return;const x=rep.rows.find(y=>rk(y)===tr.dataset.k);if(!x)return;
tr.querySelector('[name=p]').checked=!!x.present;['in','out'].forEach(k=>{const c=tr.querySelector('.tc[data-k='+k+']');if(x[k])setT(c,x[k]);else{c.querySelector('.tt').value='';c.querySelector('input[type=hidden]').value=''}})});cnt()}
function sortRow(tr){const tb=tr.parentNode;if(tr.querySelector('[name=p]').checked){tb.prepend(tr);return}
const n=tr.dataset.n,nxt=[...tb.children].find(r=>r!==tr&&!r.querySelector('[name=p]').checked&&r.dataset.n.localeCompare(n)>0);nxt?tb.insertBefore(tr,nxt):tb.appendChild(tr)}
function cnt(){const rs=[...document.querySelectorAll('.tb tbody tr')],p=rs.filter(r=>r.querySelector('[name=p]').checked).length;$('#tot').textContent=rs.length;$('#pre').textContent=p;$('#abs').textContent=rs.length-p}
const rowData=r=>(r.querySelectorAll('.tc').forEach(c=>tcUpd(c)),{...S.att.rows[+r.dataset.i],present:r.querySelector('[name=p]').checked,in:r.querySelector('[name=in]').value,out:r.querySelector('[name=out]').value});
function teamsTab(){const sug=pool().filter(m=>!S.tm.includes(m));
return `<form id='tf' class='card stack'><h2>${S.editT?'Edit team':'Create team'}</h2><div><label for='tn'>Team name</label><input id='tn' value='${esc(S.tn)}' placeholder='Enter team name'></div>
<div><label for='mi'>Add members</label><div class='row' style='flex-wrap:nowrap'><input id='mi' placeholder='Member name, then press Enter'><button type='button' class='btn ghost' data-act='addM'>Add</button></div>
<div style='margin-top:8px'>${S.tm.map((m,i)=>`<button type='button' class='chip on' data-act='rmM' data-id='${i}' aria-label='Remove ${esc(m)}'>${esc(m)} ✕</button>`).join('')||'<span class=mut style=font-size:.85rem>No members added yet.</span>'}</div>
${sug.length?`<p class='mut' style='font-size:.8rem;margin-top:10px'>Existing members: tap to add</p><div>${sug.map(m=>`<button type='button' class='chip' data-act='pickM' data-id='${esc(m)}'>+ ${esc(m)}</button>`).join('')}</div>`:''}</div>
<div class='row'><button class='btn' type='submit'>${S.editT?'Save team':'Create team'}</button>${S.editT?'<button type=button class="btn ghost" data-act=cancelT>Cancel</button>':''}</div></form>
<h2 style='margin:28px 0 12px'>Teams</h2>${DB.teams.length?`<div class='stack'>${DB.teams.map(t=>`<div class='card'><div class='row sp'><div><h2>${esc(t.name)}</h2><p class='mut' style='font-size:.85rem'>${t.members.length} member(s)</p></div><div class='row'><button class='btn ghost sm' data-act='editT' data-id='${t.id}'>Edit</button><button class='btn del sm' data-act='delT' data-id='${t.id}'>Delete</button></div></div><div style='margin-top:8px'>${t.members.map(m=>`<span class='chip'>${esc(m)}</span>`).join('')}</div></div>`).join('')}</div>`:`<div class='card'><p class='mut'>No teams yet.</p></div>`}`}
function areportsTab(){return `<div class='row sp' style='margin-bottom:14px'><p class='mut'>${DB.areps.length} report(s)</p>${DB.areps.length?'<button class=btn data-act=pdf>Export all to PDF</button>':''}</div>`+(DB.areps.length?`<div class='stack'>${[...DB.areps].sort((a,b)=>b.at-a.at).map(r=>{const[p,a]=stat(r);return `<div class='card'><div class='row sp'><div><h2>${esc(r.evName)}</h2><p class='mut' style='font-size:.9rem'>${ldr(r)} · ${fmt(r.date)}</p><p style='margin-top:6px'><span class='tag g'>${p} present</span>${r.final===false?" <span class='tag n'>In progress</span>":''}</p></div><div class='row'>${DB.aev.some(e=>e.id===r.evId)?`<button class='btn ghost sm' data-act='editAev' data-id='${r.evId}'>Edit event</button>`:''}<button class='btn ghost sm' data-act='pdf' data-id='${r.id}'>PDF</button><button class='btn ghost sm' data-act='editAtt' data-id='${r.id}'>Edit</button><button class='btn del sm' data-act='delAtt' data-id='${r.id}'>Delete</button></div></div>${tbl(r)}</div>`}).join('')}</div>`:`<div class='card'><h2>No reports yet</h2><p class='mut'>Attendance reports submitted by members appear here.</p></div>`)}
function aeventsTab(){if(!DB.aev.length)return `<div class='card'><h2>No events yet</h2><p class='mut'>Events created by members appear here.</p></div>`;
return `<div class='stack'>${[...DB.aev].reverse().map(e=>S.editAev===e.id?`<form id='aef' class='card stack' data-id='${e.id}'><h2>Edit event</h2>
<div><label for='en2'>Event name</label><input id='en2' value='${esc(e.name)}' required></div>
<div class='grid2'><div><label for='el2'>Event’s leader</label><input id='el2' value='${esc(e.leader)}' required></div><div><label for='tl2'>Task’s leader</label><input id='tl2' value='${esc(e.tleader||'')}' required></div></div>
<div class='grid2'><div><label for='jm2'>Jar money</label><input id='jm2' type='number' min='0' step='any' value='${esc(e.jar||'')}' required></div><div><label for='ed2'>Event date</label><input id='ed2' type='date' value='${esc(e.date)}' required></div></div>
<div class='row'><button class='btn' type='submit'>Save changes</button><button type='button' class='btn ghost' data-act='cancelAev'>Cancel</button></div></form>`
:`<div class='card'><div class='row sp'><div><h2>${esc(e.name)}</h2><p class='mut' style='font-size:.9rem'>${ldr(e)} · ${fmt(e.date)}</p></div><div class='row'><button class='btn ghost sm' data-act='editAev' data-id='${e.id}'>Edit event</button><button class='btn del sm' data-act='delAev' data-id='${e.id}'>Delete</button></div></div></div>`).join('')}</div>`}
V.aadmin=()=>`${brand()}<div class='row sp' style='margin-bottom:16px'><h1 style='font-size:1.8rem'>Attendance admin</h1><button class='btn ghost sm' data-act='logout'>Log out</button></div>
<div class='tabs' style='margin-bottom:16px'>${[['aevents','Events ('+DB.aev.length+')'],['teams','Teams ('+DB.teams.length+')'],['areports','Reports ('+DB.areps.length+')'],['admins','Admins']].map(([k,l])=>`<button data-act='atab' data-t='${k}' class='${S.atab===k?'on':''}'>${l}</button>`).join('')}</div>${S.atab==='aevents'?aeventsTab():S.atab==='teams'?teamsTab():S.atab==='admins'?adminsTab():areportsTab()}`;
V.print=()=>{const rs=S.pdf?DB.areps.filter(r=>r.id===S.pdf):[...DB.areps].sort((a,b)=>a.date<b.date?1:-1);
return `<div class='row sp noprint' style='margin-bottom:16px'>${back('aadmin','Reports')}<button class='btn' data-act='doPrint'>Print / Save as PDF</button></div>
<div class='pdf'><h1 style='font-size:1.8rem'>Attendance report</h1><p style='color:#555'>Generated ${new Date().toLocaleDateString()}</p>${rs.map(r=>{const[p,a]=stat(r);return `<section style='margin-top:26px;break-inside:avoid-page'><h2 style='font-size:1.3rem'>${esc(r.evName)}</h2><p>${ldr(r)} · Date: ${fmt(r.date)}</p><p><b>Present: ${p}</b></p>${tbl(r)}</section>`}).join('')}</div>`};
function render(keep){if(!ready){$('#app').innerHTML=bootView();return}if(/^(admin|aadmin|print)$/.test(S.view)&&!S.admin)S.view='login';const y=scrollY;$('#app').innerHTML=(S.view==='landing'?'':hdr())+V[S.view]();window.scrollTo(0,keep?y:0);if(S.view==='amark')cnt();if(S.view==='report')document.querySelectorAll('.line').forEach(r=>upd(r))}
function upd(row){const e=evById(S.rep.eventId),exp=e.items[+row.dataset.i].qty,v=row.querySelector('[name=q]').value,st=row.querySelector('.st'),w=row.querySelector('.why');
if(v===''){st.innerHTML='';w.hidden=true;return}const ok=+v===+exp;st.innerHTML=ok?'<span class="ok" aria-label="Match">✓</span>':'<span class="bad" aria-label="Mismatch">✕</span>';w.hidden=ok}

const A={
go(_,t){S.view=t;if(t==='admin'){S.tab=S.editEv?'create':S.tab}render()},
logout(){S.admin=false;S.view='role';render()},
tab(_,t){S.tab=t;if(t!=='create')S.editEv=null;render()},
addItem(_,__,b){b.closest('form').querySelector('.items').insertAdjacentHTML('beforeend',itemRow())},
pickPreset(_,t,b){const box=b.closest('form').querySelector('.items');let items=[];if(t!=='custom'){const p=DB.presets.find(x=>x.id===t);items=p?p.items:[];if(!items.length)toast((t==='full'?'Full Bag':'Half Bag')+' preset is empty. Define it in the Bag presets tab.')}
box.innerHTML=(items.length?items:[{name:'',qty:''}]).map(i=>itemRow(i.name,i.qty)).join('');b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))},
rmItem(_,__,b){if(b.closest('form').querySelectorAll('.irow').length>1)b.closest('.irow').remove()},
editEv(id){S.editEv=id;S.tab='create';render()},
cancelEdit(){S.editEv=null;render()},
delEv(id){if(!confirm('Delete this event and all its reports?'))return;DB.events=DB.events.filter(e=>e.id!==id);DB.reports=DB.reports.filter(r=>r.eventId!==id);save();render();toast('Event deleted')},
newRep(id,t){S.rep={eventId:id,type:t,id:null,from:'member'};S.view='report';render()},
editRep(id,t){const r=DB.reports.find(x=>x.id===id);if(!evById(r.eventId))return toast('Its event was deleted');S.rep={eventId:r.eventId,type:r.type,id,from:t};S.view='report';render()},
delAdmin(u){if(confirm('Delete admin '+u+'?')&&DB.admins.length>1&&u!==S.admin){DB.admins=DB.admins.filter(a=>a.u!==u);save();render(true)}},
async setPw(u,_,b){const v=b.previousElementSibling.value;if(v.length<6)return toast('Password must be at least 6 characters');const salt=uid()+uid(),hh=await sha(salt,v),a=DB.admins.find(x=>x.u===u);if(!a)return;a.salt=salt;a.h=hh;save();render(true);toast('Password updated')},
editAev(id){S.editAev=id;S.atab='aevents';render()},
cancelAev(){S.editAev=null;render(true)},
ap(_,__,b){dirtyRow(b.closest('tr'));b.dataset.p=b.dataset.p==='PM'?'AM':'PM';b.textContent=b.dataset.p;tcUpd(b.closest('.tc'))},
home(){S.view='landing';render()},
task(_,t){S.task=t;S.view='role';render()},
atab(_,t){S.atab=t;render()},
mark(id,t){const e=DB.aev.find(x=>x.id===id),r=DB.areps.find(x=>x.evId===id);S.att={evId:id,name:e.name,leader:e.leader,tleader:e.tleader||'',jar:e.jar||'',date:e.date,repId:r?r.id:null,from:t,rows:mergeRows(r)};S.view='amark';render()},
editAtt(id){const r=DB.areps.find(x=>x.id===id);S.att={evId:r.evId,name:r.evName,leader:r.leader,tleader:r.tleader||'',jar:r.jar||'',date:r.date,repId:id,from:'aadmin',rows:r.rows.map(x=>({...x}))};S.view='amark';render()},
now(_,t,b){const d=new Date(),tr=b.closest('tr');dirtyRow(tr);setT(tr.querySelector('.tc[data-k='+t+']'),pad(d.getHours())+':'+pad(d.getMinutes()));if(t==='in'){tr.querySelector('[name=p]').checked=true;sortRow(tr)}cnt()},
saveRow(_,__,b){const tr=b.closest('tr'),row=rowData(tr),k=row.name+'|'+row.team;S.att.rows[+tr.dataset.i]=row;
upsertReport(rep=>{const i=rep.rows.findIndex(x=>x.name+'|'+x.team===k);if(i<0)rep.rows.push(row);else rep.rows[i]=row});
tr.dataset.d='0';b.textContent='Saved ✓';toast('Saved to the cloud')},
submitAtt(){const a=S.att,trs=[...document.querySelectorAll('.tb tbody tr')];if(!trs.length)return toast('No members to submit');
const old=findRep(a),rows=trs.map(tr=>{const mine=rowData(tr),k=mine.name+'|'+mine.team;if(tr.dataset.d==='1'||!old)return mine;return old.rows.find(x=>x.name+'|'+x.team===k)||mine});
upsertReport(rep=>{rep.rows=rows;Object.assign(rep,{evName:a.name,leader:a.leader,tleader:a.tleader||'',jar:a.jar||'',date:a.date})},true);
S.view=a.from;if(a.from==='aadmin')S.atab='areports';render();toast('Attendance submitted')},
delAev(id){if(confirm('Delete this event? Submitted reports stay with the admin.')){DB.aev=DB.aev.filter(e=>e.id!==id);save();render(true)}},
delAtt(id){if(confirm('Delete this attendance report?')){DB.areps=DB.areps.filter(r=>r.id!==id);save();render(true)}},
addM(){const v=$('#mi').value.trim();if(v&&!S.tm.includes(v))S.tm.push(v);render(true);$('#mi').focus()},
pickM(id){S.tm.push(id);render(true)},
rmM(id){S.tm.splice(+id,1);render(true)},
editT(id){const t=DB.teams.find(x=>x.id===id);S.editT=id;S.tn=t.name;S.tm=[...t.members];render()},
cancelT(){S.editT=null;S.tn='';S.tm=[];render(true)},
delT(id){if(confirm('Delete this team?')){DB.teams=DB.teams.filter(t=>t.id!==id);save();render(true)}},
pdf(id){S.pdf=id||null;S.view='print';render()},
doPrint(){try{window.print()}catch(e){toast('Use your browser print command')}},
toggle(id,_,b){S.open[id]=!S.open[id];b.closest('.acc').classList.toggle('open',S.open[id]);b.setAttribute('aria-expanded',S.open[id])},
delRep(id){if(!confirm('Delete this report?'))return;DB.reports=DB.reports.filter(r=>r.id!==id);save();const y=scrollY;render();scrollTo(0,y);toast('Report deleted')}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&A[b.dataset.act])A[b.dataset.act](b.dataset.id,b.dataset.t,b)});
document.addEventListener('input',e=>{const t=e.target;if(t.name==='q')upd(t.closest('.line'));if(t.id==='tn')S.tn=t.value;if(t.classList.contains('tt'))dirtyRow(t.closest('tr'));if(t.id==='srch'){const q=t.value.trim().toLowerCase();document.querySelectorAll('.tb tbody tr').forEach(r=>r.hidden=!r.dataset.s.includes(q))}});
document.addEventListener('change',e=>{const rw=e.target.closest('.tb tbody tr');if(rw)dirtyRow(rw);const c=e.target.closest('.tc');if(c&&e.target.classList.contains('tt'))tcUpd(c,true);if(e.target.name==='p'){sortRow(e.target.closest('tr'));cnt()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='mi'){e.preventDefault();A.addM()}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;
if(f.id==='af'){DB.aev.push({id:uid(),name:$('#an').value.trim(),leader:$('#al').value.trim(),tleader:$('#tl').value.trim(),jar:$('#aj').value,date:$('#ad').value});save();render(true);toast('Event created')}
if(f.id==='tf'){const m=$('#mi').value.trim();if(m&&!S.tm.includes(m))S.tm.push(m);const name=$('#tn').value.trim();if(!name||!S.tm.length)return toast('Add a team name and at least one member');
if(S.editT)Object.assign(DB.teams.find(t=>t.id===S.editT),{name,members:S.tm});else DB.teams.push({id:uid(),name,members:S.tm});
S.editT=null;S.tn='';S.tm=[];save();render(true);toast('Team saved')}
if(f.id==='lf')login($('#un').value,$('#pw').value);
if(f.id==='aef'){const e=DB.aev.find(x=>x.id===f.dataset.id),d={name:$('#en2').value.trim(),leader:$('#el2').value.trim(),tleader:$('#tl2').value.trim(),jar:$('#jm2').value,date:$('#ed2').value};
Object.assign(e,d);DB.areps.filter(r=>r.evId===e.id).forEach(r=>Object.assign(r,{evName:d.name,leader:d.leader,tleader:d.tleader,jar:d.jar,date:d.date}));
S.editAev=null;save();render(true);toast('Event updated')}
if(f.id==='nf')addAdmin($('#nu').value.trim(),$('#np').value);
if(f.classList.contains('pform')){const k=f.dataset.k,items=[...f.querySelectorAll('.irow')].map(r=>({name:r.querySelector('[name=in]').value.trim(),qty:r.querySelector('[name=iq]').value})).filter(i=>i.name);
if(!items.length||items.some(i=>i.qty===''))return toast('Add at least one item with a quantity');
const p=DB.presets.find(x=>x.id===k);if(p)p.items=items;else DB.presets.push({id:k,items});save();render(true);toast((k==='full'?'Full Bag':'Half Bag')+' preset saved')}
if(f.id==='ef'){const items=[...document.querySelectorAll('.irow')].map(r=>({name:r.querySelector('[name=in]').value.trim(),qty:r.querySelector('[name=iq]').value})).filter(i=>i.name);
if(!items.length||items.some(i=>i.qty===''))return toast('Add at least one item with a quantity');
const d={name:$('#en').value.trim(),date:$('#ed').value,items},sel=document.querySelector('#bagsel .on');if(sel)d.bag=sel.dataset.t;
if(S.editEv)Object.assign(evById(S.editEv),d);else DB.events.push({id:uid(),...d});
const wasEdit=!!S.editEv;S.editEv=null;S.tab='events';save();render();toast(wasEdit?'Event saved':'Event created')}
if(f.id==='rf'){const R=S.rep,ev=evById(R.eventId),err=$('#rerr');let bad='';
const lines=[...document.querySelectorAll('.line')].map(r=>{const it=ev.items[+r.dataset.i],q=r.querySelector('[name=q]').value,rs=r.querySelector('[name=r]').value.trim();
if(q==='')bad=`Enter a count for ${it.name}.`;else if(+q!==+it.qty&&!rs)bad=`Tell us why ${it.name} is missing or different.`;
return{name:it.name,qty:q,exp:it.qty,reason:+q===+it.qty?'':rs}});
if(bad){err.textContent=bad;err.hidden=false;return}
const d={eventId:R.eventId,type:R.type,leader:$('#ln').value.trim(),support:$('#sn').value.trim(),lines,at:Date.now()};
const rid=R.id||uid();if(R.id)Object.assign(DB.reports.find(r=>r.id===R.id),d);else DB.reports.push({id:rid,...d});
save();S.view=R.from;S.tab='reports';S.open[R.eventId]=true;render();toast(R.id?'Report updated':'Report submitted')}});
initFb();render();
</script>
</body>
</html>
